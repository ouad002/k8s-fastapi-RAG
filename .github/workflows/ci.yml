name : CI

on :
    push:
        branches: [master]
    pull_request:
jobs:
    build-and-test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Build docker image
              run : docker build -t k8s-fastapi:ci .
            
            - name: Start container
              run : docker run -d -p 8000:8000 --name api k8s-fastapi:ci

            - name: Smoke test endpoints
              run: |
                for i in $(seq 1 15); do
                    curl -fsS http://localhost:8000/health && break
                    sleep 2
                done
                curl -fsS http://localhost:8000/health
                curl -fsS http://localhost:8000/ready

            - name: Show logs on failure
              if: failure()
              run: docker logs api

            - name: Clean up
              if: always()
              run: docker rm -f api
    k8s-test:
        needs: build-and-test
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Create kind cluster
              uses: helm/kind-action@v1
              with:
                cluster_name: ci

            - name: Build image with the tag used in the manifest
              run: docker build -t docker.io/library/k8s-fastapi:v1 .

            - name: Load image into kind
              run: kind load docker-image docker.io/library/k8s-fastapi:v1 --name ci

            - name: Apply manifests
              run: kubectl apply -f k8s/

            - name: Wait for rollout
              run: kubectl rollout status deployment/fastapi --timeout=120s

            - name: Smoke test through the Service
              run: |
                    kubectl port-forward service/fastapi 8000:8000 &
                    sleep 5
                    curl -fsS http://localhost:8000/health
                    curl -fsS http://localhost:8000/ready

            - name: Debug info on failure
              if: failure()
              run: |
                  kubectl get all
                  kubectl describe pods
                  kubectl logs deployment/fastapi --tail=50
    publish:
        needs: [build-and-test, k8s-test]
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        runs-on: ubuntu-latest
        permissions:
            contents: write
            packages: write
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                registry: ghcr.io
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}

            - name: Generate tags and labels
              id: meta
              uses: docker/metadata-action@v5
              with:
                images: ghcr.io/${{ github.repository }}
                tags: |
                  type=sha
                  type=raw,value=latest

            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                context: .
                push: true
                tags: ${{ steps.meta.outputs.tags }}
                labels: ${{ steps.meta.outputs.labels }}
            - name: Update Kubernetes deployment manifest
              run: |
                # The metadata-action creates tags like: ghcr.io/ouad002/k8s-fastapi-rag:sha-1234567
                # We extract just the sha tag to update the manifest
                REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
                NEW_IMAGE_TAG="ghcr.io/${REPO_LOWER}:sha-${GITHUB_SHA::7}"
                
                # Use sed to replace the existing image line in deployment.yaml
                sed -i "s|image: ghcr.io/.*|image: $NEW_IMAGE_TAG|g" k8s/deployment.yaml
                
                echo "Updated deployment.yaml to use image: $NEW_IMAGE_TAG"
                cat k8s/deployment.yaml | grep image:

            - name: Commit and push changes
              run: |
                git config --global user.name "GitHub Actions Bot"
                git config --global user.email "actions@github.com"
                git add k8s/deployment.yaml
                
                # Only commit if there is actually a change to prevent failing the workflow
                git commit -m "chore: update image tag to sha-${GITHUB_SHA::7} [skip ci]" || echo "No changes to commit"
                git push